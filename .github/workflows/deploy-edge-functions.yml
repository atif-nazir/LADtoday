name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Specific function to deploy (leave blank to deploy all)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing required secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing required secret: SUPABASE_PROJECT_ID"
            exit 1
          fi

      - name: Determine functions to deploy
        id: functions
        run: |
          set -euo pipefail

          # Manual dispatch with a specific function name
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.function_name }}" ]; then
            echo "Manual dispatch — deploying single function: ${{ github.event.inputs.function_name }}"
            echo "list=${{ github.event.inputs.function_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual dispatch with no name — deploy all
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying ALL functions"
            ALL=$(ls -1 supabase/functions \
              | grep -vE '^_' \
              | while read -r d; do [ -f "supabase/functions/$d/index.ts" ] && echo "$d"; done \
              | tr '\n' ' ')
            echo "list=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push event — deploy only changed functions
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'supabase/functions/**' \
            | awk -F/ '{print $3}' \
            | sort -u \
            | grep -vE '^_' \
            | while read -r d; do [ -n "$d" ] && [ -f "supabase/functions/$d/index.ts" ] && echo "$d"; done \
            | tr '\n' ' ')

          if [ -z "$CHANGED" ]; then
            echo "No edge function changes detected — nothing to deploy."
          else
            echo "Changed functions: $CHANGED"
          fi
          echo "list=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        if: steps.functions.outputs.list != ''
        run: |
          set -euo pipefail
          for fn in ${{ steps.functions.outputs.list }}; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --no-verify-jwt
            echo "::endgroup::"
          done
          echo "✅ Deployment complete"
